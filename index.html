<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<title>Cultura de Costura</title>

<style>
html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: linear-gradient(45deg, #0a0a0a, #1a1a2e, #16213e);
    background-size: 400% 400%;
    animation: gradientShift 15s ease infinite;
    overflow: hidden;
    font-family: "Segoe UI", system-ui, sans-serif;
    position: relative;
}

body::before{
    content:"";
    position:absolute;
    inset:0;
    background: repeating-linear-gradient(
        0deg,
        transparent,
        transparent 2px,
        rgba(0, 255, 255, 0.03) 2px,
        rgba(0, 255, 255, 0.03) 4px
    );
    pointer-events:none;
    z-index:0;
}

@keyframes gradientShift{
    0%{ background-position:0% 50%; }
    50%{ background-position:100% 50%; }
    100%{ background-position:0% 50%; }
}

/* ================= IFRAMES ================= */
.iframe{
    position: fixed;
    top: -2.5%;
    left: 0;
    width: 100%;
    height: 105%;
    border: none;
    opacity: 0;
    z-index: 1;
    transition: opacity 0.5s ease;
}
.visible{
    opacity: 1;
    z-index: 2;
}

/* ================= OVERLAY GLITCH ================= */
#overlay{
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: linear-gradient(135deg,
        rgba(0,10,20,0.98) 0%,
        rgba(5,5,25,0.99) 50%,
        rgba(0,0,0,0.98) 100%);
    z-index: 10;
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s ease;
}

#overlay.visible{
    opacity: 1;
    pointer-events: all;
}

/* ================= GLITCH EFFECT ================= */
@keyframes glitchIn {
    0% { 
        transform: scale(1.1) skewX(10deg); 
        opacity: 0;
        filter: hue-rotate(90deg) saturate(2);
    }
    10% { transform: scale(0.95) skewX(-5deg); }
    20% { transform: scale(1.02) skewX(3deg); }
    30% { transform: scale(0.98) skewX(-2deg); }
    40% { 
        transform: scale(1) skewX(0); 
        opacity: 1;
        filter: hue-rotate(0deg) saturate(1);
    }
    100% { transform: scale(1) skewX(0); opacity: 1; }
}

@keyframes glitchText {
    0%, 100% { 
        text-shadow: 
            0 0 20px rgba(0,255,255,0.8),
            0 0 40px rgba(0,255,255,0.5);
        transform: translateX(0);
    }
    10% { 
        text-shadow: 
            -3px 0 #ff00ff, 
            3px 0 #00ffff,
            0 0 30px rgba(255,0,255,0.8);
        transform: translateX(-2px);
    }
    20% { 
        text-shadow: 
            3px 0 #ff00ff, 
            -3px 0 #00ffff,
            0 0 30px rgba(0,255,255,0.8);
        transform: translateX(2px);
    }
    30% { 
        text-shadow: 
            0 3px #ff00ff, 
            0 -3px #00ffff;
        transform: translateX(0);
    }
    40% { 
        text-shadow: 
            -2px -2px #ff00ff, 
            2px 2px #00ffff,
            0 0 50px rgba(0,255,255,1);
        transform: translateX(-1px);
    }
    50% {
        text-shadow: 
            0 0 20px rgba(0,255,255,0.8),
            0 0 60px rgba(0,255,255,0.6),
            0 0 100px rgba(0,255,255,0.4);
    }
}

@keyframes neonPulse {
    0%, 100% { 
        box-shadow: 
            0 0 5px #00ffff,
            0 0 10px #00ffff,
            0 0 20px #00ffff,
            0 0 40px #00ffff;
    }
    50% { 
        box-shadow: 
            0 0 10px #ff00ff,
            0 0 20px #ff00ff,
            0 0 40px #ff00ff,
            0 0 80px #ff00ff;
    }
}

@keyframes scanline {
    0% { top: -100%; }
    100% { top: 100%; }
}

@keyframes flicker {
    0%, 19%, 21%, 23%, 25%, 54%, 56%, 100% { opacity: 1; }
    20%, 24%, 55% { opacity: 0.6; }
}

/* ================= SCANLINE EFFECT ================= */
#overlay::after {
    content: "";
    position: absolute;
    top: -100%;
    left: 0;
    width: 100%;
    height: 5px;
    background: linear-gradient(90deg, 
        transparent, 
        rgba(0,255,255,0.8), 
        rgba(255,0,255,0.8), 
        transparent);
    opacity: 0;
    z-index: 20;
    box-shadow: 0 0 20px rgba(0,255,255,0.5);
}

#overlay.visible::after {
    opacity: 1;
    animation: scanline 0.8s linear;
}

/* ================= CARD ================= */
#card{
    text-align:center;
    transform: translateY(0);
}

#overlay.visible #card{
    animation: glitchIn 0.8s cubic-bezier(0.34, 1.56, 0.64, 1);
}

#title{
    font-size: 3.5vw;
    font-weight: 900;
    letter-spacing: 8px;
    color: #00ffff;
    text-shadow:
        0 0 20px rgba(0,255,255,0.8),
        0 0 40px rgba(0,255,255,0.5);
    text-transform: uppercase;
    position: relative;
}

#overlay.visible #title {
    animation: glitchText 1.5s ease-in-out, flicker 0.15s ease-in-out 3;
}

/* Glitch clone layers */
#title::before,
#title::after {
    content: attr(data-text);
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    opacity: 0;
}

#overlay.visible #title::before {
    color: #ff00ff;
    animation: glitchClone1 0.8s ease-in-out;
    clip-path: polygon(0 0, 100% 0, 100% 45%, 0 45%);
}

#overlay.visible #title::after {
    color: #00ffff;
    animation: glitchClone2 0.8s ease-in-out;
    clip-path: polygon(0 55%, 100% 55%, 100% 100%, 0 100%);
}

@keyframes glitchClone1 {
    0%, 100% { opacity: 0; transform: translateX(0); }
    20% { opacity: 0.8; transform: translateX(-10px); }
    40% { opacity: 0.8; transform: translateX(10px); }
    60% { opacity: 0; transform: translateX(-5px); }
}

@keyframes glitchClone2 {
    0%, 100% { opacity: 0; transform: translateX(0); }
    20% { opacity: 0.8; transform: translateX(10px); }
    40% { opacity: 0.8; transform: translateX(-10px); }
    60% { opacity: 0; transform: translateX(5px); }
}

#subtitle{
    font-size: 1.4vw;
    letter-spacing: 4px;
    font-weight: 600;
    color: #fff;
    background: linear-gradient(90deg, #00ffff, #ff00ff, #00ffff);
    background-size: 200% auto;
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    margin: 25px 0 50px;
    animation: gradientFlow 3s linear infinite;
    text-transform: uppercase;
}

@keyframes gradientFlow{
    0%{ background-position: 0% center; }
    100%{ background-position: 200% center; }
}

/* ================= CAROUSEL ================= */
#carousel{
    width: 1200px;
    height: 260px;
    overflow: hidden;
    margin: auto;
    position: relative;
}

#track{
    display:flex;
    gap:24px;
    transition: transform 1.8s cubic-bezier(0.25, 0.46, 0.45, 0.94);
}

.item{
    width: 220px;
    height: 240px;
    border-radius: 16px;
    overflow: hidden;
    background: linear-gradient(135deg, #1a1a2e, #0f0f1e);
    opacity: 0.5;
    filter: grayscale(60%);
    transform: scale(0.9);
    transition: all 0.8s cubic-bezier(0.25, 0.46, 0.45, 0.94);
    box-shadow: 0 8px 24px rgba(0,0,0,0.3);
    border: 2px solid rgba(0,255,255,0.1);
    position: relative;
}

.item::before{
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(135deg, rgba(0,255,255,0.15), transparent);
    opacity: 0;
    transition: opacity 0.6s ease;
}

.item.active{
    opacity: 1;
    filter: grayscale(0%);
    transform: scale(1.1);
    box-shadow:
        0 20px 45px rgba(0,0,0,0.4),
        0 0 35px rgba(0,255,255,0.5);
    border-color: #00ffff;
    border-width: 3px;
    animation: neonPulse 2s ease-in-out infinite;
}

.item.active::before{ opacity: 1; }

.item.fading{
    opacity: 0.3;
    filter: grayscale(80%);
    transform: scale(0.85);
}

.item img{
    width: 100%;
    height: 100%;
    object-fit: cover;
}

/* ================= CORNER ACCENTS ================= */
.corner-accent{
    position: fixed;
    width: 150px;
    height: 150px;
    z-index: 11;
    opacity: 0;
    transition: opacity 0.4s ease;
}

#overlay.visible .corner-accent{ 
    opacity: 0.8;
    animation: neonPulse 1.5s ease-in-out infinite;
}

.corner-accent.tl{
    top: 0; left: 0;
    border-top: 3px solid #00ffff;
    border-left: 3px solid #00ffff;
}
.corner-accent.tr{
    top: 0; right: 0;
    border-top: 3px solid #ff00ff;
    border-right: 3px solid #ff00ff;
}
.corner-accent.bl{
    bottom: 0; left: 0;
    border-bottom: 3px solid #ff00ff;
    border-left: 3px solid #ff00ff;
}
.corner-accent.br{
    bottom: 0; right: 0;
    border-bottom: 3px solid #00ffff;
    border-right: 3px solid #00ffff;
}

/* ================= LOADING ================= */
#loading{
    position: fixed;
    bottom: 40px;
    right: 40px;
    z-index: 15;
    display: none;
    color: #00ffff;
    font-size: 1.2vw;
    font-weight: 600;
    letter-spacing: 2px;
    text-shadow: 0 0 15px #00ffff;
    padding: 15px 30px;
    background: rgba(0,20,40,0.8);
    border: 2px solid #00ffff;
    border-radius: 8px;
    backdrop-filter: blur(10px);
    animation: neonPulse 1s ease-in-out infinite;
}

/* ================= GLITCH OVERLAY EFFECT ================= */
.glitch-overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 9;
    opacity: 0;
}

.glitch-overlay.active {
    animation: glitchOverlay 0.5s ease-out;
}

@keyframes glitchOverlay {
    0% { 
        opacity: 1;
        background: linear-gradient(
            90deg, 
            transparent 0%, 
            rgba(0,255,255,0.1) 25%, 
            rgba(255,0,255,0.1) 50%, 
            rgba(0,255,255,0.1) 75%, 
            transparent 100%
        );
        transform: translateX(-100%);
    }
    50% {
        opacity: 1;
        transform: translateX(0%);
    }
    100% { 
        opacity: 0;
        transform: translateX(100%);
    }
}

/* ================= ELECTRIC LINES ================= */
.electric-line {
    position: fixed;
    height: 2px;
    background: linear-gradient(90deg, transparent, #00ffff, #ff00ff, #00ffff, transparent);
    z-index: 12;
    opacity: 0;
    box-shadow: 0 0 10px #00ffff, 0 0 20px #ff00ff;
}

.electric-line.top { top: 0; left: 0; width: 100%; }
.electric-line.bottom { bottom: 0; left: 0; width: 100%; }
.electric-line.left { top: 0; left: 0; width: 2px; height: 100%; }
.electric-line.right { top: 0; right: 0; width: 2px; height: 100%; }

#overlay.visible .electric-line {
    animation: electricPulse 0.8s ease-out;
}

@keyframes electricPulse {
    0% { opacity: 0; transform: scaleX(0); }
    30% { opacity: 1; transform: scaleX(1); }
    100% { opacity: 0; transform: scaleX(1); }
}

#overlay.visible .electric-line.left,
#overlay.visible .electric-line.right {
    animation: electricPulseV 0.8s ease-out;
}

@keyframes electricPulseV {
    0% { opacity: 0; transform: scaleY(0); }
    30% { opacity: 1; transform: scaleY(1); }
    100% { opacity: 0; transform: scaleY(1); }
}
</style>
</head>

<body>

<div id="loading">● CARGANDO</div>

<div class="glitch-overlay"></div>

<div id="overlay">
    <div class="electric-line top"></div>
    <div class="electric-line bottom"></div>
    <div class="electric-line left"></div>
    <div class="electric-line right"></div>
    
    <div class="corner-accent tl"></div>
    <div class="corner-accent tr"></div>
    <div class="corner-accent bl"></div>
    <div class="corner-accent br"></div>

    <div id="card">
        <div id="title" data-text="CULTURA DE COSTURA">CULTURA DE COSTURA</div>
        <div id="subtitle"></div>
        <div id="carousel">
            <div id="track"></div>
        </div>
    </div>
</div>

<iframe id="frameA" class="iframe visible"></iframe>
<iframe id="frameB" class="iframe"></iframe>

<canvas id="particles" style="position: fixed; top:0; left:0; z-index:0;"></canvas>

<script>
/* ================= DATA ================= */
const links = [
    "https://app.powerbi.com/view?r=eyJrIjoiNjMyMDUwNWYtNWIzNS00ODRiLWE3NTAtOTRkZWY1MzFhMmJiIiwidCI6IjU0NmM0MjUzLTY3NTQtNGYwNC05OWRiLTY5MWMyMDQ2YjJlYyIsImMiOjR9",
    "https://app.powerbi.com/view?r=eyJrIjoiMWNiNGUzNDEtYjA1ZC00N2U3LWJiYzEtNDQ0MTljMWQxNTliIiwidCI6IjU0NmM0MjUzLTY3NTQtNGYwNC05OWRiLTY5MWMyMDQ2YjJlYyIsImMiOjR9",
    "https://app.powerbi.com/view?r=eyJrIjoiMDEzNTdhNTUtOGU4ZS00MDVhLWEwMWItMGJhZTQxZDI4ZTg0IiwidCI6IjU0NmM0MjUzLTY3NTQtNGYwNC05OWRiLTY5MWMyMDQ2YjJlYyIsImMiOjR9",
    "https://app.powerbi.com/view?r=eyJrIjoiNjE4MGQ4NWEtNTUwYS00ZTg4LWFhNjUtYWMwYzE5YWI2MTcxIiwidCI6IjU0NmM0MjUzLTY3NTQtNGYwNC05OWRiLTY5MWMyMDQ2YjJlYyIsImMiOjR9",
    "https://app.powerbi.com/view?r=eyJrIjoiMDhlOWZmZGQtZWNlMS00NmY4LWJjM2EtYTdkZjdiNjQ0YWU2IiwidCI6IjU0NmM0MjUzLTY3NTQtNGYwNC05OWRiLTY5MWMyMDQ2YjJlYyIsImMiOjR9"
];

const images = [
    ["img/productividad.jpg","img/trabajo en equipo.jpg","img/calidad.jpg","img/Empatia.jpg","img/obsesion por el cliente.jpg","img/orientacion a resultados.jpg"],
    ["img/trabajo en equipo.jpg","img/obsesion por el cliente.jpg","img/orientacion a resultados.jpg"],
    ["img/productividad.jpg","img/calidad.jpg","img/Empatia.jpg"],
    ["img/calidad.jpg","img/orientacion a resultados.jpg","img/Empatia.jpg"],
    ["img/productividad.jpg","img/trabajo en equipo.jpg","img/obsesion por el cliente.jpg"]
];

const subtitles = [
    "VISIÓN INTEGRAL DE DESEMPEÑO",
    "ENFOQUE SEMANAL DE RESULTADOS",
    "GESTIÓN DIARIA OPERATIVA",
    "CONTROL DE CALIDAD Y RDL",
    "CULTURA Y DISCIPLINA"
];

/* ================= CONFIG - ACTUALIZADO ================= */
const SWAP_INTERVAL_MS   = 20000;  // ✅ 20 segundos (antes 60s)
const PRELOAD_START_MS   = 12000;  // ✅ precarga a los 12s
const PRELOAD_TIMEOUT_MS = 15000;  // timeout de precarga
const MAX_RETRIES        = 2;

const OVERLAY_SHOW_MS    = 600;    // overlay aparece rápido
const OVERLAY_EXTRA_MS   = 1200;   // ✅ overlay dura menos (más dinámico)
const FADE_IN_MS         = 500;    // fade más rápido

const HERO_INTERVAL_MS   = 7000;   // ✅ 7 segundos (más lento para apreciar)

const PREVENTIVE_REFRESH_MS = 3600000; // 1h

/* ================= STATE ================= */
let biIndex = 0;
let slideIndex = 0;
let activeFrame = "A";
let heroTimer;
let preloadTimer;
let swapTimer;

let isSwapping = false;
let isPreloading = false;
let retryCount = 0;
let nextFrameReady = false;

/* ================= ELEMENTS ================= */
const frameA = document.getElementById("frameA");
const frameB = document.getElementById("frameB");
const overlay = document.getElementById("overlay");
const track = document.getElementById("track");
const subtitle = document.getElementById("subtitle");
const loading = document.getElementById("loading");
const glitchOverlay = document.querySelector(".glitch-overlay");

/* ================= GLITCH TRIGGER ================= */
function triggerGlitch() {
    glitchOverlay.classList.add("active");
    setTimeout(() => {
        glitchOverlay.classList.remove("active");
    }, 500);
}

/* ================= CAROUSEL ================= */
function buildCarousel(set){
    clearInterval(heroTimer);
    track.innerHTML = "";
    slideIndex = 0;

    set.forEach((src, i) => {
        const d = document.createElement("div");
        d.className = "item" + (i === 0 ? " active" : "");
        d.innerHTML = `<img src="${src}">`;
        track.appendChild(d);
    });

    track.style.transform = "translateX(0)";
    heroTimer = setInterval(rotateHero, HERO_INTERVAL_MS);
}

function rotateHero(){
    const items = document.querySelectorAll(".item");
    if (!items.length) return;

    items[slideIndex].classList.add("fading");

    setTimeout(() => {
        items[slideIndex].classList.remove("active","fading");
        slideIndex = (slideIndex + 1) % items.length;
        items[slideIndex].classList.add("active");

        const centerOffset = Math.max(0, slideIndex - 1) * 244;
        track.style.transform = `translateX(-${centerOffset}px)`;
    }, 500);
}

/* ================= HELPERS ================= */
function getIncomingFrame(){ return activeFrame === "A" ? frameB : frameA; }
function getOutgoingFrame(){ return activeFrame === "A" ? frameA : frameB; }

function waitFrameLoad(frame, timeout=6000){
    return new Promise((resolve) => {
        let done = false;

        const onLoad = () => {
            if (done) return;
            done = true;
            frame.removeEventListener("load", onLoad);
            resolve(true);
        };

        frame.addEventListener("load", onLoad);

        setTimeout(() => {
            if (done) return;
            done = true;
            frame.removeEventListener("load", onLoad);
            resolve(false);
        }, timeout);
    });
}

/* ================= PRELOAD ================= */
function startPreload(){
    if (isPreloading || isSwapping) return;
    isPreloading = true;

    const nextIndex = (biIndex + 1) % links.length;
    const nextUrl = links[nextIndex];
    const incoming = getIncomingFrame();

    let loadTimeout;
    let loaded = false;

    const onLoad = () => {
        if (loaded) return;
        loaded = true;
        clearTimeout(loadTimeout);
        incoming.removeEventListener("load", onLoad);
        nextFrameReady = true;
        isPreloading = false;
        console.log(`✓ Reporte ${nextIndex + 1} listo`);
    };

    incoming.addEventListener("load", onLoad);
    incoming.src = nextUrl;

    loadTimeout = setTimeout(() => {
        if (loaded) return;
        loaded = true;
        incoming.removeEventListener("load", onLoad);

        retryCount++;
        if (retryCount < MAX_RETRIES) {
            console.log(`⚠ Reintento ${retryCount}/${MAX_RETRIES}`);
            isPreloading = false;
            setTimeout(startPreload, 2000);
        } else {
            console.log("✗ Saltando reporte (precarga falló)");
            nextFrameReady = false;
            isPreloading = false;
            retryCount = 0;
        }
    }, PRELOAD_TIMEOUT_MS);
}

/* ================= SWAP ================= */
async function swapBI(){
    if (isSwapping) return;

    if (!nextFrameReady) {
        console.log("Forzando precarga...");
        loading.style.display = "block";
        startPreload();

        setTimeout(() => {
            if (nextFrameReady) executeSwap();
            else {
                console.log("Saltando al siguiente");
                biIndex = (biIndex + 1) % links.length;
                loading.style.display = "none";
                scheduleNextCycle();
            }
        }, 10000);
        return;
    }

    const incoming = getIncomingFrame();
    await waitFrameLoad(incoming, 6000);

    executeSwap();
}

function executeSwap(){
    isSwapping = true;
    loading.style.display = "none";

    const incoming = getIncomingFrame();
    const outgoing = getOutgoingFrame();

    // 1) Trigger glitch effect
    triggerGlitch();

    // 2) Overlay visible con delay mínimo
    setTimeout(() => {
        overlay.classList.add("visible");

        setTimeout(() => {
            // 3) Actualizar texto e imágenes
            biIndex = (biIndex + 1) % links.length;
            subtitle.textContent = subtitles[biIndex] || "";
            buildCarousel(images[biIndex] || images[0]);

            // 4) Fade-in incoming
            setTimeout(() => {
                incoming.classList.add("visible");

                // 5) Apagar outgoing
                setTimeout(() => {
                    outgoing.classList.remove("visible");
                    activeFrame = activeFrame === "A" ? "B" : "A";

                    // 6) Cerrar overlay
                    setTimeout(() => {
                        overlay.classList.remove("visible");

                        nextFrameReady = false;
                        retryCount = 0;
                        isSwapping = false;

                        scheduleNextCycle();
                    }, OVERLAY_EXTRA_MS);

                }, FADE_IN_MS);

            }, 200);

        }, OVERLAY_SHOW_MS);

    }, 100);
}

/* ================= CYCLE ================= */
function scheduleNextCycle(){
    clearTimeout(preloadTimer);
    clearTimeout(swapTimer);

    preloadTimer = setTimeout(startPreload, PRELOAD_START_MS);
    swapTimer = setTimeout(swapBI, SWAP_INTERVAL_MS);
}

/* ================= INIT ================= */
frameA.src = links[0];
subtitle.textContent = subtitles[0];
buildCarousel(images[0]);

frameA.addEventListener("load", () => {
    loading.style.display = "none";
    scheduleNextCycle();
}, { once: true });

/* Refresh preventivo cada hora */
setInterval(() => {
    if (isSwapping) return;
    const visibleFrame = getOutgoingFrame();
    visibleFrame.src = links[biIndex];
    console.log("↻ Refresh preventivo del reporte visible");
}, PREVENTIVE_REFRESH_MS);

/* ================= PARTICLES ================= */
const canvas = document.getElementById("particles");
const ctx = canvas.getContext("2d");

function resizeCanvas(){
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
}
resizeCanvas();
window.addEventListener("resize", resizeCanvas);

let particles = [];
for (let i = 0; i < 35; i++) {
    particles.push({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height,
        vx: (Math.random() - 0.5) * 1.5,
        vy: (Math.random() - 0.5) * 1.5,
        size: Math.random() * 2.5 + 1,
        color: Math.random() > 0.5 ? "#00ffff" : "#ff00ff"
    });
}

function animateParticles(){
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    particles.forEach(p => {
        p.x += p.vx;
        p.y += p.vy;

        if (p.x < 0 || p.x > canvas.width) p.vx *= -1;
        if (p.y < 0 || p.y > canvas.height) p.vy *= -1;

        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fillStyle = p.color;
        ctx.shadowBlur = 15;
        ctx.shadowColor = p.color;
        ctx.fill();
    });
    requestAnimationFrame(animateParticles);
}
animateParticles();

/* ================= ERROR RECOVERY ================= */
window.addEventListener("error", (e) => {
    console.error("Error:", e.message);
    if (isSwapping) {
        isSwapping = false;
        loading.style.display = "none";
        overlay.classList.remove("visible");
    }
});
</script>
