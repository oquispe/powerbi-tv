<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<title>Cultura de Costura</title>

<style>
html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: #0a0a12;
    overflow: hidden;
    font-family: "Segoe UI", system-ui, sans-serif;
}

/* ================= IFRAMES ================= */
.iframe{
    position: fixed;
    top: -2.5%;
    left: 0;
    width: 100%;
    height: 105%;
    border: none;
    opacity: 0;
    z-index: 1;
    transition: opacity 1.2s ease;
}
.visible{
    opacity: 1;
    z-index: 2;
}

/* ================= OVERLAY LIGERO ================= */
#overlay{
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: radial-gradient(ellipse at center,
        rgba(0,20,40,0.97) 0%,
        rgba(5,5,15,0.99) 100%);
    z-index: 10;
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.8s ease;
}

#overlay.visible{
    opacity: 1;
    pointer-events: all;
}

/* ================= CARD ================= */
#card{
    text-align: center;
    opacity: 0;
    transform: scale(0.98);
    transition: opacity 0.6s ease, transform 0.6s ease;
}

#overlay.visible #card{
    opacity: 1;
    transform: scale(1);
}

#title{
    font-size: 3.5vw;
    font-weight: 900;
    letter-spacing: 8px;
    color: #00ffff;
    text-shadow:
        0 0 30px rgba(0,255,255,0.6),
        0 0 60px rgba(0,255,255,0.3);
    text-transform: uppercase;
}

#subtitle{
    font-size: 1.4vw;
    letter-spacing: 4px;
    font-weight: 600;
    color: #a0a0ff;
    margin: 25px 0 50px;
    text-transform: uppercase;
    text-shadow: 0 0 20px rgba(160,160,255,0.5);
}

/* ================= CAROUSEL ================= */
#carousel{
    width: 1200px;
    height: 260px;
    overflow: hidden;
    margin: auto;
    position: relative;
}

#track{
    display: flex;
    gap: 24px;
    transition: transform 1.5s ease;
}

.item{
    width: 220px;
    height: 240px;
    border-radius: 16px;
    overflow: hidden;
    background: #1a1a2e;
    opacity: 0.4;
    filter: grayscale(50%) brightness(0.7);
    transform: scale(0.9);
    transition: all 0.8s ease;
    border: 2px solid rgba(0,255,255,0.2);
}

.item.active{
    opacity: 1;
    filter: grayscale(0%) brightness(1);
    transform: scale(1.08);
    border-color: #00ffff;
    box-shadow: 0 0 30px rgba(0,255,255,0.4);
}

.item.fading{
    opacity: 0.3;
    filter: grayscale(70%) brightness(0.5);
    transform: scale(0.85);
}

.item img{
    width: 100%;
    height: 100%;
    object-fit: cover;
}

/* ================= CORNER GLOW (ligero) ================= */
.corner{
    position: fixed;
    width: 120px;
    height: 120px;
    z-index: 11;
    opacity: 0;
    transition: opacity 0.5s ease;
}

#overlay.visible .corner{
    opacity: 0.7;
}

.corner.tl{ top: 20px; left: 20px; border-top: 2px solid #00ffff; border-left: 2px solid #00ffff; }
.corner.tr{ top: 20px; right: 20px; border-top: 2px solid #ff00ff; border-right: 2px solid #ff00ff; }
.corner.bl{ bottom: 20px; left: 20px; border-bottom: 2px solid #ff00ff; border-left: 2px solid #ff00ff; }
.corner.br{ bottom: 20px; right: 20px; border-bottom: 2px solid #00ffff; border-right: 2px solid #00ffff; }

/* ================= LOADING ================= */
#loading{
    position: fixed;
    bottom: 40px;
    right: 40px;
    z-index: 15;
    display: none;
    color: #00ffff;
    font-size: 1.2vw;
    font-weight: 600;
    letter-spacing: 2px;
    padding: 15px 30px;
    background: rgba(0,20,40,0.9);
    border: 1px solid #00ffff;
    border-radius: 8px;
}
</style>
</head>

<body>

<div id="loading">● CARGANDO</div>

<div id="overlay">
    <div class="corner tl"></div>
    <div class="corner tr"></div>
    <div class="corner bl"></div>
    <div class="corner br"></div>

    <div id="card">
        <div id="title">CULTURA DE COSTURA</div>
        <div id="subtitle"></div>
        <div id="carousel">
            <div id="track"></div>
        </div>
    </div>
</div>

<iframe id="frameA" class="iframe visible"></iframe>
<iframe id="frameB" class="iframe"></iframe>

<script>
/* ================= DATA ================= */
const links = [
    "https://app.powerbi.com/view?r=eyJrIjoiNjMyMDUwNWYtNWIzNS00ODRiLWE3NTAtOTRkZWY1MzFhMmJiIiwidCI6IjU0NmM0MjUzLTY3NTQtNGYwNC05OWRiLTY5MWMyMDQ2YjJlYyIsImMiOjR9",
    "https://app.powerbi.com/view?r=eyJrIjoiMWNiNGUzNDEtYjA1ZC00N2U3LWJiYzEtNDQ0MTljMWQxNTliIiwidCI6IjU0NmM0MjUzLTY3NTQtNGYwNC05OWRiLTY5MWMyMDQ2YjJlYyIsImMiOjR9",
    "https://app.powerbi.com/view?r=eyJrIjoiMDEzNTdhNTUtOGU4ZS00MDVhLWEwMWItMGJhZTQxZDI4ZTg0IiwidCI6IjU0NmM0MjUzLTY3NTQtNGYwNC05OWRiLTY5MWMyMDQ2YjJlYyIsImMiOjR9",
    "https://app.powerbi.com/view?r=eyJrIjoiNjE4MGQ4NWEtNTUwYS00ZTg4LWFhNjUtYWMwYzE5YWI2MTcxIiwidCI6IjU0NmM0MjUzLTY3NTQtNGYwNC05OWRiLTY5MWMyMDQ2YjJlYyIsImMiOjR9",
    "https://app.powerbi.com/view?r=eyJrIjoiMDhlOWZmZGQtZWNlMS00NmY4LWJjM2EtYTdkZjdiNjQ0YWU2IiwidCI6IjU0NmM0MjUzLTY3NTQtNGYwNC05OWRiLTY5MWMyMDQ2YjJlYyIsImMiOjR9"
];

const images = [
    ["img/productividad.jpg","img/trabajo en equipo.jpg","img/calidad.jpg","img/Empatia.jpg","img/obsesion por el cliente.jpg","img/orientacion a resultados.jpg"],
    ["img/trabajo en equipo.jpg","img/obsesion por el cliente.jpg","img/orientacion a resultados.jpg"],
    ["img/productividad.jpg","img/calidad.jpg","img/Empatia.jpg"],
    ["img/calidad.jpg","img/orientacion a resultados.jpg","img/Empatia.jpg"],
    ["img/productividad.jpg","img/trabajo en equipo.jpg","img/obsesion por el cliente.jpg"]
];

const subtitles = [
    "VISIÓN INTEGRAL DE DESEMPEÑO",
    "ENFOQUE SEMANAL DE RESULTADOS",
    "GESTIÓN DIARIA OPERATIVA",
    "CONTROL DE CALIDAD Y RDL",
    "CULTURA Y DISCIPLINA"
];

/* ================= CONFIG OPTIMIZADO TV ================= */
const SWAP_INTERVAL_MS   = 20000;  // 20 segundos
const PRELOAD_START_MS   = 12000;  // precarga a los 12s
const PRELOAD_TIMEOUT_MS = 15000;
const MAX_RETRIES        = 2;

const OVERLAY_SHOW_MS    = 400;    // overlay rápido
const OVERLAY_STAY_MS    = 1500;   // tiempo visible
const FADE_IN_MS         = 800;

const HERO_INTERVAL_MS   = 7000;   // 7 segundos carrusel

const PREVENTIVE_REFRESH_MS = 3600000;

/* ================= STATE ================= */
let biIndex = 0;
let slideIndex = 0;
let activeFrame = "A";
let heroTimer, preloadTimer, swapTimer;
let isSwapping = false;
let isPreloading = false;
let retryCount = 0;
let nextFrameReady = false;

/* ================= ELEMENTS ================= */
const frameA = document.getElementById("frameA");
const frameB = document.getElementById("frameB");
const overlay = document.getElementById("overlay");
const track = document.getElementById("track");
const subtitle = document.getElementById("subtitle");
const loading = document.getElementById("loading");

/* ================= CAROUSEL ================= */
function buildCarousel(set){
    clearInterval(heroTimer);
    track.innerHTML = "";
    slideIndex = 0;

    set.forEach((src, i) => {
        const d = document.createElement("div");
        d.className = "item" + (i === 0 ? " active" : "");
        d.innerHTML = `<img src="${src}">`;
        track.appendChild(d);
    });

    track.style.transform = "translateX(0)";
    heroTimer = setInterval(rotateHero, HERO_INTERVAL_MS);
}

function rotateHero(){
    const items = document.querySelectorAll(".item");
    if (!items.length) return;

    items[slideIndex].classList.add("fading");

    setTimeout(() => {
        items[slideIndex].classList.remove("active","fading");
        slideIndex = (slideIndex + 1) % items.length;
        items[slideIndex].classList.add("active");

        const offset = Math.max(0, slideIndex - 1) * 244;
        track.style.transform = `translateX(-${offset}px)`;
    }, 400);
}

/* ================= HELPERS ================= */
function getIncomingFrame(){ return activeFrame === "A" ? frameB : frameA; }
function getOutgoingFrame(){ return activeFrame === "A" ? frameA : frameB; }

/* ================= PRELOAD ================= */
function startPreload(){
    if (isPreloading || isSwapping) return;
    isPreloading = true;

    const nextIndex = (biIndex + 1) % links.length;
    const incoming = getIncomingFrame();
    let loaded = false;
    let loadTimeout;

    const onLoad = () => {
        if (loaded) return;
        loaded = true;
        clearTimeout(loadTimeout);
        incoming.removeEventListener("load", onLoad);
        nextFrameReady = true;
        isPreloading = false;
    };

    incoming.addEventListener("load", onLoad);
    incoming.src = links[nextIndex];

    loadTimeout = setTimeout(() => {
        if (loaded) return;
        loaded = true;
        incoming.removeEventListener("load", onLoad);

        retryCount++;
        if (retryCount < MAX_RETRIES) {
            isPreloading = false;
            setTimeout(startPreload, 2000);
        } else {
            nextFrameReady = false;
            isPreloading = false;
            retryCount = 0;
        }
    }, PRELOAD_TIMEOUT_MS);
}

/* ================= SWAP ================= */
function swapBI(){
    if (isSwapping) return;

    if (!nextFrameReady) {
        loading.style.display = "block";
        startPreload();
        setTimeout(() => {
            if (nextFrameReady) executeSwap();
            else {
                biIndex = (biIndex + 1) % links.length;
                loading.style.display = "none";
                scheduleNextCycle();
            }
        }, 8000);
        return;
    }

    executeSwap();
}

function executeSwap(){
    isSwapping = true;
    loading.style.display = "none";

    const incoming = getIncomingFrame();
    const outgoing = getOutgoingFrame();

    // 1) Mostrar overlay con fade suave
    overlay.classList.add("visible");

    setTimeout(() => {
        // 2) Actualizar contenido
        biIndex = (biIndex + 1) % links.length;
        subtitle.textContent = subtitles[biIndex] || "";
        buildCarousel(images[biIndex] || images[0]);

        // 3) Mostrar nuevo frame
        setTimeout(() => {
            incoming.classList.add("visible");

            setTimeout(() => {
                outgoing.classList.remove("visible");
                activeFrame = activeFrame === "A" ? "B" : "A";

                // 4) Cerrar overlay
                setTimeout(() => {
                    overlay.classList.remove("visible");
                    nextFrameReady = false;
                    retryCount = 0;
                    isSwapping = false;
                    scheduleNextCycle();
                }, OVERLAY_STAY_MS);

            }, FADE_IN_MS);

        }, OVERLAY_SHOW_MS);

    }, 300);
}

/* ================= CYCLE ================= */
function scheduleNextCycle(){
    clearTimeout(preloadTimer);
    clearTimeout(swapTimer);
    preloadTimer = setTimeout(startPreload, PRELOAD_START_MS);
    swapTimer = setTimeout(swapBI, SWAP_INTERVAL_MS);
}

/* ================= INIT ================= */
frameA.src = links[0];
subtitle.textContent = subtitles[0];
buildCarousel(images[0]);

frameA.addEventListener("load", () => {
    loading.style.display = "none";
    scheduleNextCycle();
}, { once: true });

// Refresh preventivo cada hora
setInterval(() => {
    if (isSwapping) return;
    getOutgoingFrame().src = links[biIndex];
}, PREVENTIVE_REFRESH_MS);

/* ================= ERROR RECOVERY ================= */
window.addEventListener("error", () => {
    if (isSwapping) {
        isSwapping = false;
        loading.style.display = "none";
        overlay.classList.remove("visible");
    }
});
</script>

</body>
</html>
