<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<title>Cultura de Costura</title>

<style>
html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: linear-gradient(45deg, #0a0a0a, #1a1a2e, #16213e);
    background-size: 400% 400%;
    animation: gradientShift 15s ease infinite;
    overflow: hidden;
    font-family: "Segoe UI", system-ui, sans-serif;
    position: relative;
}

body::before{
    content:"";
    position:absolute;
    inset:0;
    background: repeating-linear-gradient(
        0deg,
        transparent,
        transparent 2px,
        rgba(0, 255, 255, 0.03) 2px,
        rgba(0, 255, 255, 0.03) 4px
    );
    pointer-events:none;
    z-index:0;
}

@keyframes gradientShift{
    0%{ background-position:0% 50%; }
    50%{ background-position:100% 50%; }
    100%{ background-position:0% 50%; }
}

/* ================= IFRAMES ================= */
.iframe{
    position: fixed;
    top: -2.5%;
    left: 0;
    width: 100%;
    height: 105%;
    border: none;
    opacity: 0;
    transition: opacity 1s ease, transform 1s cubic-bezier(0.4, 0, 0.2, 1);
    z-index: 1;
    will-change: opacity, transform;
    transform: scale(0.95);
}
.visible{ 
    opacity: 1; 
    z-index: 2;
    transform: scale(1);
}

/* ================= OVERLAY ================= */
#overlay{
    position: fixed;
    inset: 0;
    background: radial-gradient(circle at center, rgba(0,20,40,0.95), rgba(0,0,0,0.98));
    z-index: 5;
    display: none;
    align-items: center;
    justify-content: center;
    opacity: 0;
    transition: opacity 0.5s ease;
    backdrop-filter: blur(0px);
}
#overlay.visible{ 
    display: flex;
    opacity: 1;
    backdrop-filter: blur(10px);
    animation: overlayPulse 2s ease-in-out;
}

@keyframes overlayPulse{
    0%, 100%{ transform: scale(1); }
    50%{ transform: scale(1.02); }
}

/* ================= CARD ================= */
#card{ text-align:center; }

#title{
    font-size: 3.5vw;
    font-weight: 900;
    letter-spacing: 8px;
    color: #00ffff;
    text-shadow: 
        0 0 20px rgba(0,255,255,0.8),
        0 0 40px rgba(0,255,255,0.6),
        0 0 60px rgba(0,255,255,0.4),
        0 0 80px rgba(0,255,255,0.2);
    animation: titleEnter 1.5s ease-out, glitchSubtle 3s infinite;
    text-transform: uppercase;
}

@keyframes titleEnter{
    0%{ 
        opacity: 0; 
        transform: translateY(-30px) scale(0.8);
        letter-spacing: 20px;
    }
    100%{ 
        opacity: 1; 
        transform: translateY(0) scale(1);
        letter-spacing: 8px;
    }
}

@keyframes glitchSubtle{
    0%,100%{ transform: translate(0) scale(1); }
    25%{ transform: translate(-1px,1px) scale(1); }
    50%{ transform: translate(1px,-1px) scale(1.01); }
    75%{ transform: translate(-1px,-1px) scale(1); }
}

#subtitle{
    font-size: 1.4vw;
    letter-spacing: 4px;
    font-weight: 600;
    color: #fff;
    background: linear-gradient(90deg, #00ffff, #ff00ff, #00ffff);
    background-size: 200% auto;
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    margin: 25px 0 50px;
    animation: subtitleSlide 1.2s ease-out, gradientFlow 4s linear infinite;
    text-transform: uppercase;
}

@keyframes subtitleSlide{
    0%{ 
        opacity: 0; 
        transform: translateX(-50px);
    }
    100%{ 
        opacity: 1; 
        transform: translateX(0);
    }
}

@keyframes gradientFlow{
    0%{ background-position: 0% center; }
    100%{ background-position: 200% center; }
}

/* ================= CAROUSEL ================= */
#carousel{
    width: 1200px;
    height: 260px;
    overflow: hidden;
    margin: auto;
    position: relative;
}
#track{
    display:flex;
    gap:24px;
    transition: transform 1.5s ease-in-out;
    will-change: transform;
}

.item{
    width: 220px;
    height: 240px;
    border-radius: 16px;
    overflow: hidden;
    background: linear-gradient(135deg, #1a1a2e, #0f0f1e);
    opacity: 0.4;
    filter: blur(2px) grayscale(50%);
    transform: scale(0.88);
    transition: all 1s cubic-bezier(0.4, 0, 0.2, 1);
    box-shadow: 0 8px 24px rgba(0,0,0,0.3);
    border: 2px solid rgba(0,255,255,0.1);
    will-change: transform, opacity;
    position: relative;
}

.item::before{
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(135deg, rgba(0,255,255,0.1), transparent);
    opacity: 0;
    transition: opacity 0.8s ease;
}

.item.active{
    opacity: 1;
    filter: blur(0) grayscale(0%);
    transform: scale(1.12);
    box-shadow: 
        0 25px 50px rgba(0,0,0,0.4), 
        0 0 40px rgba(0,255,255,0.4),
        inset 0 0 30px rgba(0,255,255,0.1);
    border-color: #00ffff;
    border-width: 3px;
}

.item.active::before{
    opacity: 1;
}

.item.fading{
    opacity: 0;
    filter: blur(5px) grayscale(100%);
    transform: scale(0.75) rotateY(15deg);
}

.item img{
    width: 100%;
    height: 100%;
    object-fit: cover;
}

/* Loading indicator */
#loading{
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    z-index: 10;
    display: none;
    color: #00ffff;
    font-size: 1.8vw;
    font-weight: 700;
    letter-spacing: 3px;
    text-shadow: 0 0 20px #00ffff, 0 0 40px #00ffff;
    animation: pulse 1.5s ease-in-out infinite;
}

@keyframes pulse{
    0%, 100%{ opacity: 0.6; transform: translate(-50%, -50%) scale(1); }
    50%{ opacity: 1; transform: translate(-50%, -50%) scale(1.05); }
}

/* Hex grid background */
#overlay::before{
    content: "";
    position: absolute;
    inset: 0;
    background-image: 
        linear-gradient(30deg, rgba(0,255,255,0.02) 12%, transparent 12.5%, transparent 87%, rgba(0,255,255,0.02) 87.5%, rgba(0,255,255,0.02)),
        linear-gradient(150deg, rgba(0,255,255,0.02) 12%, transparent 12.5%, transparent 87%, rgba(0,255,255,0.02) 87.5%, rgba(0,255,255,0.02)),
        linear-gradient(30deg, rgba(0,255,255,0.02) 12%, transparent 12.5%, transparent 87%, rgba(0,255,255,0.02) 87.5%, rgba(0,255,255,0.02)),
        linear-gradient(150deg, rgba(0,255,255,0.02) 12%, transparent 12.5%, transparent 87%, rgba(0,255,255,0.02) 87.5%, rgba(0,255,255,0.02));
    background-size: 80px 140px;
    background-position: 0 0, 0 0, 40px 70px, 40px 70px;
    opacity: 0;
    animation: hexFade 2s ease-in forwards;
}

@keyframes hexFade{
    to{ opacity: 1; }
}
</style>
</head>

<body>

<div id="loading">Cargando...</div>

<div id="overlay">
  <div id="card">
    <div id="title">CULTURA DE COSTURA</div>
    <div id="subtitle"></div>
    <div id="carousel">
      <div id="track"></div>
    </div>
  </div>
</div>

<iframe id="frameA" class="iframe visible"></iframe>
<iframe id="frameB" class="iframe"></iframe>

<canvas id="particles" style="position: fixed; top:0; left:0; z-index:0;"></canvas>

<script>
/* ================= DATA ================= */
const links = [
  "https://app.powerbi.com/view?r=eyJrIjoiNjMyMDUwNWYtNWIzNS00ODRiLWE3NTAtOTRkZWY1MzFhMmJiIiwidCI6IjU0NmM0MjUzLTY3NTQtNGYwNC05OWRiLTY5MWMyMDQ2YjJlYyIsImMiOjR9",
  "https://app.powerbi.com/view?r=eyJrIjoiMWNiNGUzNDEtYjA1ZC00N2U3LWJiYzEtNDQ0MTljMWQxNTliIiwidCI6IjU0NmM0MjUzLTY3NTQtNGYwNC05OWRiLTY5MWMyMDQ2YjJlYyIsImMiOjR9",
  "https://app.powerbi.com/view?r=eyJrIjoiMDEzNTdhNTUtOGU4ZS00MDVhLWEwMWItMGJhZTQxZDI4ZTg0IiwidCI6IjU0NmM0MjUzLTY3NTQtNGYwNC05OWRiLTY5MWMyMDQ2YjJlYyIsImMiOjR9",
  "https://app.powerbi.com/view?r=eyJrIjoiNjE4MGQ4NWEtNTUwYS00ZTg4LWFhNjUtYWMwYzE5YWI2MTcxIiwidCI6IjU0NmM0MjUzLTY3NTQtNGYwNC05OWRiLTY5MWMyMDQ2YjJlYyIsImMiOjR9",
  "https://app.powerbi.com/view?r=eyJrIjoiMDhlOWZmZGQtZWNlMS00NmY4LWJjM2EtYTdkZjdiNjQ0YWU2IiwidCI6IjU0NmM0MjUzLTY3NTQtNGYwNC05OWRiLTY5MWMyMDQ2YjJlYyIsImMiOjR9"
];

const images = [
  ["img/productividad.jpg","img/trabajo en equipo.jpg","img/calidad.jpg","img/empatia.jpg","img/obsesion por el cliente.jpg","img/orientacion a resultados.jpg"],
  ["img/trabajo en equipo.jpg","img/obsesion por el cliente.jpg","img/orientacion a resultados.jpg"],
  ["img/productividad.jpg","img/calidad.jpg","img/empatia.jpg"],
  ["img/calidad.jpg","img/orientacion a resultados.jpg","img/empatia.jpg"],
  ["img/productividad.jpg","img/trabajo en equipo.jpg","img/obsesion por el cliente.jpg"]
];

const subtitles = [
  "VISIÓN INTEGRAL DE DESEMPEÑO",
  "ENFOQUE SEMANAL DE RESULTADOS",
  "GESTIÓN DIARIA OPERATIVA",
  "CONTROL DE CALIDAD Y RDL",
  "CULTURA Y DISCIPLINA"
];

/* ================= CONFIGURACIÓN OPTIMIZADA ================= */
const SWAP_INTERVAL_MS   = 55000;  // 55 segundos entre reportes
const PRELOAD_START_MS   = 45000;  // Inicia precarga 10s antes
const PRELOAD_TIMEOUT_MS = 35000;  // Timeout generoso de 35s
const MAX_RETRIES        = 3;

/* ================= STATE ================= */
let biIndex = 0;
let slideIndex = 0;
let activeFrame = "A";
let heroTimer;
let preloadTimer;
let swapTimer;

let isSwapping = false;
let isPreloading = false;
let retryCount = 0;
let nextFrameReady = false;

/* ================= ELEMENTS ================= */
const frameA = document.getElementById("frameA");
const frameB = document.getElementById("frameB");
const overlay = document.getElementById("overlay");
const track = document.getElementById("track");
const subtitle = document.getElementById("subtitle");
const loading = document.getElementById("loading");

/* ================= BUILD CAROUSEL ================= */
function buildCarousel(set){
  clearInterval(heroTimer);
  track.innerHTML = "";
  slideIndex = 0;

  set.forEach((src, i) => {
    const d = document.createElement("div");
    d.className = "item" + (i === 0 ? " active" : "");
    d.innerHTML = `<img src="${src}">`;
    track.appendChild(d);
  });

  track.style.transform = "translateX(0)";
  heroTimer = setInterval(rotateHero, 3500);
}

/* ================= ROTATE HERO ================= */
function rotateHero(){
  const items = document.querySelectorAll(".item");
  if (!items.length) return;

  items[slideIndex].classList.add("fading");
  
  setTimeout(() => {
    items[slideIndex].classList.remove("active","fading");
    slideIndex = (slideIndex + 1) % items.length;
    items[slideIndex].classList.add("active");

    const centerOffset = Math.max(0, slideIndex - 1) * 244;
    track.style.transform = `translateX(-${centerOffset}px)`;
  }, 600);
}

/* ================= HELPERS ================= */
function getIncomingFrame(){ return activeFrame === "A" ? frameB : frameA; }
function getOutgoingFrame(){ return activeFrame === "A" ? frameA : frameB; }

/* ================= PRELOAD ANTICIPADO ================= */
function startPreload(){
  if (isPreloading || isSwapping) return;
  isPreloading = true;

  const nextIndex = (biIndex + 1) % links.length;
  const nextUrl = links[nextIndex];
  const incoming = getIncomingFrame();

  let loadTimeout;
  let loaded = false;

  const onLoad = () => {
    if (loaded) return;
    loaded = true;
    clearTimeout(loadTimeout);
    incoming.removeEventListener("load", onLoad);
    nextFrameReady = true;
    isPreloading = false;
    console.log(`✓ Reporte ${nextIndex} precargado`);
  };

  incoming.addEventListener("load", onLoad);
  incoming.src = nextUrl;

  loadTimeout = setTimeout(() => {
    if (loaded) return;
    loaded = true;
    incoming.removeEventListener("load", onLoad);
    
    retryCount++;
    if (retryCount < MAX_RETRIES) {
      console.log(`⚠ Reintentando carga (${retryCount}/${MAX_RETRIES})`);
      isPreloading = false;
      setTimeout(startPreload, 2000);
    } else {
      console.log("✗ Max reintentos alcanzado");
      nextFrameReady = false;
      isPreloading = false;
      retryCount = 0;
    }
  }, PRELOAD_TIMEOUT_MS);
}

/* ================= SWAP OPTIMIZADO ================= */
function swapBI(){
  if (isSwapping) return;
  
  // Si no está listo, intenta precargar ahora
  if (!nextFrameReady) {
    console.log("Frame no listo, forzando precarga...");
    loading.style.display = "block";
    startPreload();
    
    // Espera máximo 15s más
    setTimeout(() => {
      if (nextFrameReady) {
        executeSwap();
      } else {
        // Saltar al siguiente
        console.log("Saltando reporte problemático");
        biIndex = (biIndex + 1) % links.length;
        loading.style.display = "none";
        scheduleNextCycle();
      }
    }, 15000);
    return;
  }

  executeSwap();
}

function executeSwap(){
  isSwapping = true;
  loading.style.display = "none";

  const incoming = getIncomingFrame();
  const outgoing = getOutgoingFrame();

  // Efecto de barrido digital
  const scanline = document.createElement("div");
  scanline.style.cssText = `
    position: fixed;
    inset: 0;
    background: linear-gradient(
      180deg,
      transparent 0%,
      rgba(0,255,255,0.15) 45%,
      rgba(0,255,255,0.3) 50%,
      rgba(0,255,255,0.15) 55%,
      transparent 100%
    );
    z-index: 4;
    animation: scanDown 1.2s cubic-bezier(0.4, 0, 0.2, 1);
    pointer-events: none;
  `;
  document.body.appendChild(scanline);

  const style = document.createElement("style");
  style.textContent = `
    @keyframes scanDown{
      0%{ transform: translateY(-100%); opacity: 0; }
      50%{ opacity: 1; }
      100%{ transform: translateY(100%); opacity: 0; }
    }
  `;
  document.head.appendChild(style);

  setTimeout(() => {
    scanline.remove();
    style.remove();
  }, 1200);

  // Mostrar overlay con animación
  overlay.classList.add("visible");

  setTimeout(() => {
    biIndex = (biIndex + 1) % links.length;
    
    subtitle.textContent = subtitles[biIndex] || "";
    buildCarousel(images[biIndex] || images[0]);

    // Swap con escala
    incoming.style.transform = "scale(0.95)";
    incoming.classList.add("visible");
    
    setTimeout(() => {
      incoming.style.transform = "scale(1)";
      outgoing.style.transform = "scale(1.05)";
      outgoing.classList.remove("visible");
      
      setTimeout(() => {
        outgoing.style.transform = "scale(0.95)";
        activeFrame = activeFrame === "A" ? "B" : "A";
        
        // Ocultar overlay
        setTimeout(() => {
          overlay.classList.remove("visible");
        }, 600);

        nextFrameReady = false;
        retryCount = 0;
        isSwapping = false;

        // Programar siguiente ciclo
        scheduleNextCycle();

      }, 400);

    }, 100);

  }, 800);
}

/* ================= PROGRAMACIÓN DE CICLOS ================= */
function scheduleNextCycle(){
  clearTimeout(preloadTimer);
  clearTimeout(swapTimer);

  // Precargar 10s antes del swap
  preloadTimer = setTimeout(startPreload, PRELOAD_START_MS);
  
  // Ejecutar swap
  swapTimer = setTimeout(swapBI, SWAP_INTERVAL_MS);
}

/* ================= INIT ================= */
frameA.src = links[0];
subtitle.textContent = subtitles[0];
buildCarousel(images[0]);

frameA.addEventListener("load", () => {
  loading.style.display = "none";
  scheduleNextCycle();
}, { once: true });

/* ================= PARTICLES (REDUCIDAS) ================= */
const canvas = document.getElementById("particles");
const ctx = canvas.getContext("2d");

function resizeCanvas(){
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
resizeCanvas();
window.addEventListener("resize", resizeCanvas);

let particles = [];
for (let i = 0; i < 30; i++) {
  particles.push({
    x: Math.random() * canvas.width,
    y: Math.random() * canvas.height,
    vx: (Math.random() - 0.5) * 1.5,
    vy: (Math.random() - 0.5) * 1.5,
    size: Math.random() * 2.5 + 1,
    color: Math.random() > 0.5 ? "#00ffff" : "#ff00ff"
  });
}

function animateParticles(){
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  particles.forEach(p => {
    p.x += p.vx;
    p.y += p.vy;

    if (p.x < 0 || p.x > canvas.width) p.vx *= -1;
    if (p.y < 0 || p.y > canvas.height) p.vy *= -1;

    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
    ctx.fillStyle = p.color;
    ctx.fill();
  });
  requestAnimationFrame(animateParticles);
}
animateParticles();

/* ================= ERROR RECOVERY ================= */
window.addEventListener("error", (e) => {
  console.error("Error detectado:", e);
  if (isSwapping) {
    isSwapping = false;
    loading.style.display = "none";
    overlay.classList.remove("visible");
  }
});
</script>

</body>
</html>
